<linkset>
  <html:link
    rel="localization"
    href="__addonRef__-preferences.ftl" />
  <html:link
    rel="stylesheet"
    type="text/css"
    href="chrome://__addonRef__/content/preferences.css" />
</linkset>
<vbox onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })">
  <groupbox>
    <label
      data-l10n-id="pref-citation-databases"
      style="font-weight: bold; margin-top: 10px; margin-left: 10px" />
    <html:div class="__addonRef__-pref-options-div">
      <groupbox>
        <description
          data-l10n-id="pref-database-instructions"
          style="margin: 5px 0" />
        <html:div style="margin-bottom: 5px; min-height: 20px; margin-top: 5px; text-align: center; width: 100%">
          <html:span
            data-l10n-id="pref-database-options-label"
            class="__addonRef__-pref-options-label"></html:span>
          <html:code>crossref, semanticscholar, inspire</html:code>
        </html:div>
        <hbox
          align="center"
          style="margin-bottom: 10px">
          <html:input
            type="text"
            id="zotero-prefpane-__addonRef__-databaseOrderExposed"
            data-l10n-id="pref-database-field"
            value="crossref"
            style="flex: 1; min-width: 300px; padding: 4px" />
          <button
            id="zotero-prefpane-__addonRef__-validate-databases"
            data-l10n-id="pref-validate-button"
            style="margin-left: 10px"
            oncommand="Zotero.__addonInstance__.hooks.onPrefsEvent('validateDatabases', { window })" />
        </hbox>
        <html:div
          id="zotero-prefpane-__addonRef__-database-status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          style="margin-bottom: 5px; min-height: 20px; margin-top: 0px">
        </html:div>
      </groupbox>
    </html:div>

    <label
      data-l10n-id="pref-auto-update-settings"
      style="font-weight: bold; margin-top: 10px; margin-left: 10px" />
    <html:div class="__addonRef__-pref-options-div">
      <groupbox>
        <description data-l10n-id="pref-fetch-on-add" />
        <radiogroup
          id="zotero-prefpane-__addonRef__-fetchOnAdd"
          preference="fetchOnAdd">
          <radio
            data-l10n-id="pref-fetch-on-add-enabled"
            value="true" />
          <radio
            data-l10n-id="pref-fetch-on-add-disabled"
            value="false" />
        </radiogroup>

        <description
          data-l10n-id="pref-auto-update-description"
          style="margin-top: 8px" />
        <radiogroup
          id="zotero-prefpane-__addonRef__-autoUpdate"
          preference="autoUpdate">
          <radio
            data-l10n-id="pref-auto-update-never"
            value="never" />
          <radio
            data-l10n-id="pref-auto-update-startup"
            value="startup" />
        </radiogroup>

        <label
          data-l10n-id="pref-auto-update-cutoff-label"
          style="margin-top: 5px" />
        <menulist
          id="zotero-prefpane-__addonRef__-autoUpdateCutoff"
          preference="autoUpdateCutoff">
          <menupopup>
            <menuitem
              data-l10n-id="pref-auto-update-cutoff-3"
              value="3" />
            <menuitem
              data-l10n-id="pref-auto-update-cutoff-6"
              value="6" />
            <menuitem
              data-l10n-id="pref-auto-update-cutoff-12"
              value="12" />
            <menuitem
              data-l10n-id="pref-auto-update-cutoff-24"
              value="24" />
          </menupopup>
        </menulist>
      </groupbox>
    </html:div>

    <label
      data-l10n-id="pref-color-settings"
      style="font-weight: bold; margin-top: 10px; margin-left: 10px" />
    <html:div class="__addonRef__-pref-options-div">
      <groupbox>
        <description data-l10n-id="pref-color-description" />
        <radiogroup
          id="zotero-prefpane-__addonRef__-useColors"
          preference="useColors">
          <radio
            data-l10n-id="pref-use-colors"
            value="color" />
          <radio
            data-l10n-id="pref-no-colors"
            value="nocolor" />
        </radiogroup>
      </groupbox>
    </html:div>

    <label
      data-l10n-id="pref-apikeys-heading"
      style="font-weight: bold; margin-top: 10px; margin-left: 10px" />
    <html:div class="__addonRef__-pref-options-div">
      <groupbox>
        <description
          data-l10n-id="pref-apikey-intro"
          style="margin: 5px 0" />
        <html:div
          data-l10n-id="pref-apikey-storage"
          style="margin-bottom: 5px; font-size: 90%; opacity: 0.75"></html:div>
        <hbox
          id="zotero-prefpane-__addonRef__-semanticScholarApiKey-group"
          align="center"
          style="margin-bottom: 10px">
          <html:label
            data-l10n-id="pref-apikey-label"
            for="zotero-prefpane-__addonRef__-semanticScholarApiKey"
            style="margin-right: 8px"></html:label>
          <html:input
            type="password"
            id="zotero-prefpane-__addonRef__-semanticScholarApiKey"
            class="__addonRef__-pref-apikey-input"
            data-l10n-id="pref-apikey-field"
            autocomplete="off"
            spellcheck="false"
            style="flex: 1; min-width: 240px" />
          <button
            id="zotero-prefpane-__addonRef__-semanticScholarApiKey-validate"
            data-l10n-id="pref-validate-button"
            style="margin-left: 8px"
            oncommand="Zotero.__addonInstance__.hooks.onPrefsEvent('validateApiKey', { window })" />
        </hbox>
        <html:div
          id="zotero-prefpane-__addonRef__-semanticScholarApiKey-status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          style="margin-bottom: 5px; min-height: 20px; margin-top: 0px">
          <html:span id="zotero-prefpane-__addonRef__-semanticScholarApiKey-status-text"></html:span>
          <html:span
            id="zotero-prefpane-__addonRef__-semanticScholarApiKey-status-detail"
            class="__addonRef__-status-part"></html:span>
          <html:span
            id="zotero-prefpane-__addonRef__-semanticScholarApiKey-status-cleaned"
            class="__addonRef__-status-part"></html:span>
        </html:div>
      </groupbox>
    </html:div>
  </groupbox>
</vbox>

<separator />

<vbox>
  <hbox>
    <label
      data-l10n-id="pref-help"
      data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}' />
  </hbox>
</vbox>
