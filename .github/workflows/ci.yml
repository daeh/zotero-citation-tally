name: CI

on:
  push:
    branches:
      - main
      - "release-candidate/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Node 25+ no longer bundles Corepack; install it before it manages Yarn.
      - run: npm install -g corepack@latest && corepack enable
      - run: yarn install --immutable
      - run: yarn lint:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm install -g corepack@latest && corepack enable
      - run: yarn install --immutable
      - run: yarn tsc -p tsconfig.test.json --noEmit
      - run: yarn test:unit

  # Linux has no hidden DOM window, which is the condition that bricked v0.0.14,
  # so the plugin has to reach full-capability startup in a real Zotero: the
  # initialized flag, the bridge report, and the bundle-realm fetch self-test.
  # The scaffold runs headless under Xvfb in CI.
  zotero-runtime-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm install -g corepack@latest && corepack enable
      - run: yarn install --immutable
      - name: Install current release-channel Zotero
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zotero-client"
          extract_dir="$RUNNER_TEMP/zotero-release"
          mkdir -p "$extract_dir"

          # Resolved at job time, so the gate exercises whatever Zotero users are
          # actually running rather than a version pinned in this file.
          url=$(curl -fL --retry 3 --remove-on-error \
            -o "$archive" -w "%{url_effective}" \
            "https://www.zotero.org/download/client/dl?channel=release&platform=linux-x86_64")

          echo "Zotero: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          # Diagnostic only. Records which build was tested; it doesn't
          # authenticate a mutable download.
          sha256sum "$archive"
          # No -j/-J, since tar detects compression from the signature. An upstream
          # format change (.tar.bz2 -> .tar.xz) then can't break extraction.
          tar -xf "$archive" -C "$extract_dir"

          bin=$(find "$extract_dir" -type f -name zotero -perm -u+x -print -quit)
          [ -n "$bin" ] || { echo "::error::No Zotero binary in $url"; exit 1; }
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$bin" >> "$GITHUB_ENV"
      - name: Run Zotero runtime smoke
        # Zotero is a GUI application. With no X display it never starts, so
        # the scaffold blocks forever waiting for a debugger port that never
        # opens and the job burns its whole timeout in silence -- no error, no
        # artifact, nothing after the scaffold's last build line. Whether an
        # Xvfb happens to be running is a property of the runner image, not of
        # this workflow: v0.0.18's first candidate hung on image 20260810.271
        # and the identical commit passed in 50s on a rerun. `xvfb-run -a`
        # provisions a display and picks a free server number, so it is correct
        # whether or not the image already has one. `xvfb` is preinstalled on
        # ubuntu-24.04 (2:21.1.12-1ubuntu1.6).
        run: xvfb-run -a yarn test
      - name: Preserve Zotero test profile and logs
        # Note: this cannot fire on a *job*-level `timeout-minutes`, which
        # GitHub reports as `cancelled` rather than `failure`.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: zotero-runtime-logs
          path: .scaffold/test
          include-hidden-files: true
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm install -g corepack@latest && corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - uses: actions/upload-artifact@v7
        with:
          name: build-result
          path: .scaffold/build
          # .scaffold is a dot-directory, excluded by upload-artifact by default.
          include-hidden-files: true
          if-no-files-found: error
